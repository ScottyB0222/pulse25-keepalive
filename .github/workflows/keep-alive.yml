name: Keep Pulse25 Database Alive

on:
  schedule:
    - cron: '0 12 * * 1,3,5'   # Monday, Wednesday, Friday at noon UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl --retry 3 --retry-delay 5 --retry-all-errors --fail -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_assessment" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"p_id": "00000000-0000-0000-0000-000000000000"}'
